name: WAM daily

on:
  schedule:
    - cron: "0 13 * * *"        # 13:00 UTC daily (after arXiv announcements)
  workflow_dispatch: {}          # manual trigger

# Never let two daily runs race on the committed DB.
concurrency:
  group: wam-daily
  cancel-in-progress: false

permissions:
  contents: write                # commit results back to the repo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Configure git
        run: |
          git config user.name "wam-bot"
          git config user.email "actions@github.com"

      # --- Stage group 1: fetch + LLM analysis (checkpoint commit) ---
      - name: Fetch + analyze
        run: |
          python scripts/run_local.py \
            --stages fetch,filter,summarize,analyze,extract,score,innovation,links,people,trends
      - name: Checkpoint commit (data)
        run: |
          git add data/ && git commit -m "data: daily fetch+analysis $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash || true
          git push || echo "push skipped"

      # --- Stage group 2: render (checkpoint commit) ---
      - name: Render
        run: python scripts/run_local.py --stages render
      - name: Commit README
        run: |
          git add README.md data/ && git commit -m "render: daily update $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash || true
          git push || echo "push skipped"

      # --- Sync the fresh DB to the Hugging Face Space (so chat + dashboard stay current) ---
      - name: Sync DB to HF Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_file(
              path_or_fileobj="data/wam.db", path_in_repo="data/wam.db",
              repo_id=os.environ["HF_SPACE"], repo_type="space",
              commit_message="daily data sync")
          print("synced data/wam.db to Space", os.environ["HF_SPACE"])
          PY

      # --- Email digest (last, so failures here don't block the commit) ---
      - name: Send digest
        run: python scripts/run_local.py --stages email
