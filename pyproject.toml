[project]
name = "awesome-wam"
version = "0.1.0"
description = "Daily intelligence system for World Action Models (WAM) research: search, summarize, analyze, score, digest, and a RAG knowledge base."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",        # OpenRouter (OpenAI-compatible) client
    "pydantic>=2.7.0",       # validated LLM output schemas
    "pyyaml>=6.0",           # config
    "python-dotenv>=1.0.0",  # local .env loading
    "requests>=2.31.0",      # source APIs
    "feedparser>=6.0.0",     # arXiv / RSS news feeds
    "tenacity>=8.2.0",       # retries
    "PyMuPDF>=1.24.0",       # PDF text extraction (cached)
    "networkx>=3.2",         # citation graph / research fronts
]

[project.optional-dependencies]
webapp = [
    "streamlit>=1.36.0",  # long-context Q&A web app (no embeddings/vector DB)
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wam = ["store/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
